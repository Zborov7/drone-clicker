<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дрон-кликер | Бесплатное пробное занятие</title>
    <style>
        :root {
            --bg: #0a0e17;
            --surface: #141b25;
            --accent: #00e5ff;
            --accent2: #ff4081;
            --gold: #ffc107;
            --text: #e0e0e0;
            --text-secondary: #8899aa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 50% 30%, #0f1a2e 0%, #0a0e17 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .particle {
            position: absolute; width: 2px; height: 2px;
            background: var(--accent); border-radius: 50%;
            opacity: 0.3; animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        .game-container {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; gap: 25px; padding: 20px;
        }
        h1 {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            font-weight: 700; color: var(--text);
            text-align: center;
            text-shadow: 0 0 40px rgba(0,229,255,0.3);
        }
        h1 span { color: var(--accent); }
        .progress {
            display: flex; align-items: center; gap: 12px;
            background: var(--surface); padding: 10px 24px;
            border-radius: 50px; border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .progress-dots { display: flex; gap: 8px; }
        .dot {
            width: 16px; height: 16px; border-radius: 50%;
            background: #1e2a3a; border: 2px solid #2a3a4f;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dot.filled {
            background: var(--accent); border-color: var(--accent);
            box-shadow: 0 0 16px rgba(0,229,255,0.5);
            animation: pop 0.4s ease;
        }
        @keyframes pop {
            0% { transform: scale(1); } 50% { transform: scale(1.6); } 100% { transform: scale(1); }
        }
        .counter { color: var(--accent); font-weight: 700; font-size: 1.1rem; }

        /* Дрон-wrapper */
        .drone-wrapper {
            position: relative; cursor: pointer;
            transition: transform 0.15s;
        }
        .drone-wrapper:active { transform: scale(0.92); }
        .drone-svg {
            width: clamp(150px, 28vw, 210px);
            filter: drop-shadow(0 0 30px rgba(0,200,224,0.6));
            animation: droneFloat 3s ease-in-out infinite;
            transition: filter 0.3s;
        }
        .drone-wrapper:hover .drone-svg {
            filter: drop-shadow(0 0 50px rgba(0,229,255,0.9));
        }
        @keyframes droneFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(1deg); }
            75% { transform: translateY(2px) rotate(-1deg); }
        }
        .click-ripple {
            position: absolute; pointer-events: none;
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--accent2); opacity: 0.8;
            animation: ripple 0.7s ease-out forwards;
        }
        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.9; }
            100% { transform: scale(8); opacity: 0; }
        }
        .hint {
            color: var(--text-secondary); font-size: 0.9rem;
            opacity: 0.8; margin-top: -10px;
        }

        /* Оверлей сертификата */
        .cert-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; animation: fadeIn 0.4s ease;
        }
        .cert-overlay.hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .cert-card {
            background: linear-gradient(145deg, #1a2332, #111820);
            border: 2px solid var(--gold);
            border-radius: 24px; padding: 25px;
            max-width: 500px; width: 90%; text-align: center;
            box-shadow: 0 0 60px rgba(255,193,7,0.3), 0 20px 60px rgba(0,0,0,0.6);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5) rotateY(90deg); opacity: 0; }
            60% { transform: scale(1.05) rotateY(-5deg); opacity: 1; }
            100% { transform: scale(1) rotateY(0); opacity: 1; }
        }
        .cert-img {
            width: 100%; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .cert-btn {
            background: var(--gold); color: #0a0e17;
            border: none; padding: 14px 30px;
            border-radius: 50px; font-weight: 700;
            font-size: 1rem; cursor: pointer; margin: 8px;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(255,193,7,0.3);
        }
        .cert-btn:hover { background: #ffd54f; transform: translateY(-2px); }
        .cert-btn.secondary {
            background: transparent; border: 1px solid var(--gold);
            color: var(--gold); box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="game-container">
        <h1>Нажми на <span>дрон</span> <span id="displayClicks">0</span>/5 раз</h1>

        <div class="progress">
            <div class="progress-dots" id="dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <span class="counter" id="counter">0/5</span>
        </div>

        <!-- Новый дрон (SVG) -->
        <div class="drone-wrapper" id="droneWrapper">
            <svg class="drone-svg" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <!-- Лучи снизу -->
                <ellipse cx="100" cy="140" rx="30" ry="8" fill="#00e5ff" opacity="0.2">
                    <animate attributeName="rx" values="30;40;30" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="1.5s" repeatCount="indefinite"/>
                </ellipse>
                <!-- Корпус (овал) -->
                <ellipse cx="100" cy="85" rx="45" ry="22" fill="#1a1f2e" stroke="#ff4081" stroke-width="2.5"/>
                <!-- Центральный объектив -->
                <circle cx="100" cy="85" r="14" fill="#0d1117" stroke="#00e5ff" stroke-width="2"/>
                <circle cx="100" cy="85" r="8" fill="#00e5ff" opacity="0.8">
                    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
                </circle>
                <!-- Крылья-стабилизаторы -->
                <path d="M55 75 L30 50 L40 95 Z" fill="#1a1f2e" stroke="#00e5ff" stroke-width="2"/>
                <path d="M145 75 L170 50 L160 95 Z" fill="#1a1f2e" stroke="#00e5ff" stroke-width="2"/>
                <!-- Пропеллеры на крыльях -->
                <line x1="38" y1="70" x2="38" y2="50" stroke="#ff4081" stroke-width="3" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" from="0 38 70" to="360 38 70" dur="0.5s" repeatCount="indefinite"/>
                </line>
                <line x1="162" y1="70" x2="162" y2="50" stroke="#ff4081" stroke-width="3" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" from="0 162 70" to="360 162 70" dur="0.5s" repeatCount="indefinite"/>
                </line>
                <!-- Дополнительные лучи -->
                <line x1="55" y1="95" x2="35" y2="110" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
                <line x1="145" y1="95" x2="165" y2="110" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
                <!-- Шасси -->
                <line x1="80" y1="105" x2="70" y2="125" stroke="#8899aa" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="120" y1="105" x2="130" y2="125" stroke="#8899aa" stroke-width="2.5" stroke-linecap="round"/>
                <rect x="66" y="122" width="12" height="4" rx="2" fill="#8899aa"/>
                <rect x="122" y="122" width="12" height="4" rx="2" fill="#8899aa"/>
                <!-- Антенна -->
                <line x1="100" y1="63" x2="100" y2="45" stroke="#ff4081" stroke-width="2"/>
                <circle cx="100" cy="43" r="3" fill="#ff4081"/>
            </svg>
        </div>
        <p class="hint" id="hint">👆 Кликни по дрону!</p>
    </div>

    <!-- Сертификат -->
    <div class="cert-overlay hidden" id="certOverlay">
        <div class="cert-card">
            <img class="cert-img" id="certImage" src="" alt="Сертификат" />
            <div>
                <button class="cert-btn" id="downloadBtn">📥 Скачать сертификат</button>
                <button class="cert-btn secondary" id="continueBtn">✅ Продолжить</button>
            </div>
        </div>
    </div>

    <canvas id="certCanvas" style="display:none;"></canvas>

    <script>
        (function() {
            const MAX_CLICKS = 5;
            let clicks = 0;
            let gameActive = true;

            const droneWrapper = document.getElementById('droneWrapper');
            const dots = document.querySelectorAll('#dots .dot');
            const counter = document.getElementById('counter');
            const displayClicks = document.getElementById('displayClicks');
            const hint = document.getElementById('hint');
            const certOverlay = document.getElementById('certOverlay');
            const certImage = document.getElementById('certImage');
            const downloadBtn = document.getElementById('downloadBtn');
            const continueBtn = document.getElementById('continueBtn');
            const certCanvas = document.getElementById('certCanvas');
            const ctx = certCanvas.getContext('2d');

            // Статистика
            const STORAGE_KEY = 'drone_game_stats';
            function getStats() {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || createDefault(); }
                catch(e) { return createDefault(); }
            }
            function createDefault() {
                return { firstVisit: null, lastVisit: null, totalVisits: 0, totalClicks: 0, certsIssued: 0, sessionStart: null, totalTime: 0 };
            }
            function saveStats(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

            let stats = getStats();
            const nowISO = new Date().toISOString();
            if (!stats.firstVisit) stats.firstVisit = nowISO;
            stats.lastVisit = nowISO;
            stats.totalVisits += 1;
            stats.sessionStart = nowISO;
            saveStats(stats);

            function generateCode() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let code = 'DRONE-';
                for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
                return code;
            }

            function generateCertificate(code) {
                certCanvas.width = 800;
                certCanvas.height = 500;
                const w = certCanvas.width, h = certCanvas.height;
                // Фон
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#1a2332');
                grad.addColorStop(1, '#0d1117');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
                // Рамка
                ctx.strokeStyle = '#ffc107';
                ctx.lineWidth = 8;
                ctx.strokeRect(20, 20, w-40, h-40);
                ctx.strokeStyle = '#ff4081';
                ctx.lineWidth = 3;
                ctx.strokeRect(30, 30, w-60, h-60);
                // Текст
                ctx.fillStyle = '#ffc107';
                ctx.font = 'bold 44px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('СЕРТИФИКАТ', w/2, 130);
                ctx.fillStyle = '#e0e0e0';
                ctx.font = '24px "Segoe UI", sans-serif';
                ctx.fillText('на бесплатное пробное занятие', w/2, 190);
                ctx.fillText('по управлению дронами', w/2, 230);
                // Код
                ctx.fillStyle = '#ffc107';
                ctx.font = 'bold 38px "Courier New", monospace';
                ctx.fillText(code, w/2, 320);
                // Дата
                const dateStr = new Date().toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
                ctx.fillStyle = '#8899aa';
                ctx.font = '20px "Segoe UI", sans-serif';
                ctx.fillText('Дата выдачи: ' + dateStr, w/2, 380);
                // Декоративные линии
                ctx.strokeStyle = '#ff4081';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(150, 280);
                ctx.lineTo(250, 280);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(550, 280);
                ctx.lineTo(650, 280);
                ctx.stroke();
                // Дрон-логотип
                ctx.font = '40px sans-serif';
                ctx.fillText('🚁', w/2, 450);
                return certCanvas.toDataURL('image/png');
            }

            function updateUI() {
                dots.forEach((dot, i) => dot.classList.toggle('filled', i < clicks));
                counter.textContent = clicks + '/' + MAX_CLICKS;
                displayClicks.textContent = clicks;
                if (clicks >= MAX_CLICKS) {
                    hint.textContent = '🎉 Сертификат готов!';
                    hint.style.color = '#ffc107';
                } else if (clicks === MAX_CLICKS - 1) {
                    hint.textContent = '🔥 Ещё 1 клик!';
                    hint.style.color = '#ffc107';
                } else if (clicks === MAX_CLICKS - 2) {
                    hint.textContent = '⚡ Ещё ' + (MAX_CLICKS - clicks) + ' клика!';
                    hint.style.color = '#00e5ff';
                } else {
                    hint.textContent = '👆 Кликни по дрону!';
                    hint.style.color = '';
                }
            }

            function createRipple(x, y) {
                const ripple = document.createElement('div');
                ripple.className = 'click-ripple';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                droneWrapper.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
            }

            function handleClick(e) {
                if (!gameActive) return;
                const rect = droneWrapper.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                createRipple(x, y);
                clicks = Math.min(clicks + 1, MAX_CLICKS);
                stats = getStats();
                stats.totalClicks += 1;
                stats.lastVisit = new Date().toISOString();
                saveStats(stats);
                updateUI();
                if (clicks >= MAX_CLICKS) showCertificate();
            }

            function showCertificate() {
                gameActive = false;
                const code = generateCode();
                const dataUrl = generateCertificate(code);
                certImage.src = dataUrl;
                stats = getStats();
                stats.certsIssued += 1;
                stats.lastVisit = new Date().toISOString();
                saveStats(stats);
                certOverlay.classList.remove('hidden');
            }

            function resetGame() {
                clicks = 0;
                gameActive = true;
                updateUI();
                certOverlay.classList.add('hidden');
            }

            droneWrapper.addEventListener('click', handleClick);
            droneWrapper.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                handleClick({ clientX: t.clientX, clientY: t.clientY });
            }, { passive: false });

            downloadBtn.addEventListener('click', () => {
                const link = document.createElement('a');
                link.download = 'sertifikat.png';
                link.href = certImage.src;
                link.click();
            });

            continueBtn.addEventListener('click', resetGame);
            certOverlay.addEventListener('click', (e) => {
                if (e.target === certOverlay) resetGame();
            });

            window.addEventListener('beforeunload', () => {
                stats = getStats();
                if (stats.sessionStart) {
                    const sec = (Date.now() - new Date(stats.sessionStart).getTime()) / 1000;
                    stats.totalTime = (stats.totalTime || 0) + sec;
                    stats.sessionStart = null;
                    saveStats(stats);
                }
            });
            setInterval(() => {
                stats = getStats();
                if (stats.sessionStart) {
                    const sec = (Date.now() - new Date(stats.sessionStart).getTime()) / 1000;
                    stats.totalTime = (stats.totalTime || 0) + sec;
                    stats.sessionStart = new Date().toISOString();
                    saveStats(stats);
                }
            }, 15000);

            // Частицы
            const container = document.getElementById('particles');
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
                p.style.opacity = Math.random() * 0.4 + 0.1;
                container.appendChild(p);
            }
            updateUI();
        })();
    </script>
</body>
</html>
